<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Tres al Toque</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#f97316;color:#8a3a00;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:16px;touch-action:manipulation}.app{width:min(100%,520px);background:#fff;border-radius:24px;padding:20px;box-shadow:0 24px 70px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:8px 0 6px;font-size:clamp(2rem,10vw,3.5rem);color:#f97316}.sub{margin:0 0 18px;color:#9a5a2e}.controls,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}select,button{font:inherit;color:#9a3412;background:#fff7ed;border:1px solid #fdba74;border-radius:14px;min-height:48px;padding:0 12px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.score div{padding:10px;background:#fff7ed;border-radius:14px;text-align:center}.score strong{display:block;font-size:1.4rem;color:#f97316}.score span{font-size:.75rem;color:#9a5a2e}.status{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;font-weight:700}.chip{font-size:.75rem;color:#c2410c;border:1px solid #fdba74;background:#fff7ed;border-radius:999px;padding:7px 10px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{padding:0;min-height:0;border-radius:18px;background:#fff7ed;border:2px solid #fdba74;color:#f97316;font-size:clamp(3rem,20vw,6rem);font-weight:900;display:grid;place-items:center;touch-action:manipulation}.cell:active:not(:disabled){transform:scale(.96)}.cell:disabled{opacity:1}.cell.o{color:#9a3412}.cell.win{outline:3px solid #f97316;background:#ffedd5}.primary{background:#f97316;color:#fff;border-color:#f97316;font-weight:800}.note{text-align:center;color:#9a5a2e;font-size:.75rem;margin:14px 0 0}@media(max-width:420px){body{padding:10px}.app{padding:14px}.controls,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>Tres al Toque</h1><p class="sub">Toca una casilla para jugar.</p><div class="controls"><select id="mode"><option value="cpu">Contra la máquina</option><option value="pvp">Dos jugadores</option></select><select id="diff"><option value="easy">Máquina casual</option><option value="hard">Máquina imbatible</option></select></div><div class="score"><div><strong id="sx">0</strong><span id="lx">Tú (X)</span></div><div><strong id="sd">0</strong><span>Empates</span></div><div><strong id="so">0</strong><span id="lo">CPU (O)</span></div></div><div class="status"><span id="status">Tu turno.</span><span id="turn" class="chip">Turno: X</span></div><section class="board" id="board"></section><div class="actions"><button class="primary" id="newRound">Nueva ronda</button><button id="reset">Reiniciar marcador</button></div><p class="note">Pantalla táctil, ratón y teclado.</p></main><script>const B=document.getElementById('board'),M=document.getElementById('mode'),F=document.getElementById('diff'),S=document.getElementById('status'),T=document.getElementById('turn'),SX=document.getElementById('sx'),SO=document.getElementById('so'),SD=document.getElementById('sd'),LX=document.getElementById('lx'),LO=document.getElementById('lo');let b,t,o,sc={X:0,O:0,D:0};const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function res(x){for(const w of W)if(x[w[0]]&&x[w[0]]===x[w[1]]&&x[w[1]]===x[w[2]])return{winner:x[w[0]],line:w};return x.every(Boolean)?{winner:'D',line:[]}:null}function render(){[...B.children].forEach((c,i)=>{c.textContent=b[i]||'';c.className='cell'+(b[i]?' '+b[i].toLowerCase():'');c.disabled=!!b[i]||o||(M.value==='cpu'&&t==='O')});T.textContent='Turno: '+t;SX.textContent=sc.X;SO.textContent=sc.O;SD.textContent=sc.D;LX.textContent=M.value==='cpu'?'Tú (X)':'Jugador X';LO.textContent=M.value==='cpu'?'CPU (O)':'Jugador O';F.disabled=M.value==='pvp'}function finish(r){o=true;sc[r.winner]++;S.textContent=r.winner==='D'?'Empate.':M.value==='cpu'?(r.winner==='X'?'¡Has ganado!':'Gana la máquina.'):'Gana '+r.winner+'.';r.line.forEach(i=>B.children[i].classList.add('win'));render()}function play(i){if(o||b[i])return;b[i]=t;const r=res(b);if(r)return finish(r);t=t==='X'?'O':'X';S.textContent=M.value==='cpu'&&t==='O'?'La máquina está pensando…':'Turno de '+t+'.';render();if(M.value==='cpu'&&t==='O')setTimeout(cpu,180)}function rnd(){const a=b.map((v,i)=>v?null:i).filter(v=>v!==null);return a[Math.floor(Math.random()*a.length)]}function mm(x,max){const r=res(x);if(r)return r.winner==='O'?10:r.winner==='X'?-10:0;let best=max?-99:99;for(let i=0;i<9;i++)if(!x[i]){x[i]=max?'O':'X';const s=mm(x,!max);x[i]='';best=max?Math.max(best,s):Math.min(best,s)}return best}function best(){let q=-99,m=0;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';const s=mm(b,false);b[i]='';if(s>q){q=s;m=i}}return m}function cpu(){if(!o)play(F.value==='hard'?best():rnd())}function nr(){b=Array(9).fill('');t='X';o=false;S.textContent=M.value==='cpu'?'Tu turno.':'Turno de X.';render()}for(let i=0;i<9;i++){const x=document.createElement('button');x.className='cell';x.type='button';x.addEventListener('pointerup',e=>{e.preventDefault();play(i)});B.appendChild(x)}M.onchange=nr;F.onchange=nr;document.getElementById('newRound').onclick=nr;document.getElementById('reset').onclick=()=>{sc={X:0,O:0,D:0};nr()};nr();</script></body></html>
