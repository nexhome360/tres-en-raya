<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Queens</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;color:#47200d;padding:12px;touch-action:manipulation}.app{width:min(100%,620px);margin:auto;background:#fff;border-radius:24px;padding:16px;box-shadow:0 20px 60px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:8px 0 3px;color:#f97316;font-size:clamp(2rem,10vw,3.5rem)}p{margin:0 0 12px;color:#8a4b27}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.badge{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:7px 8px;font-size:.72rem;font-weight:800;text-align:center}.badge b{display:block;font-size:1rem;color:#c2410c;margin-top:2px}.levels{display:flex;gap:6px;overflow-x:auto;padding:3px 0 10px}.lv{min-width:42px;height:42px;border-radius:12px;border:1px solid #fdba74;background:#fff7ed;color:#c2410c;font-weight:900}.lv.active{background:#f97316;color:#fff}.lv.lock{opacity:.35}.board{display:grid;width:100%;aspect-ratio:1;border:3px solid #3b220f;border-radius:10px;overflow:hidden;user-select:none;background:#fff}.cell{border:0;padding:0;font-size:clamp(1.3rem,8vw,2.6rem);font-weight:900;display:grid;place-items:center;touch-action:manipulation;color:#3b220f;position:relative}.cell:after{content:"";position:absolute;inset:0;border-right:1px solid #0002;border-bottom:1px solid #0002;pointer-events:none}.cell.bt{border-top:3px solid #3b220f}.cell.bb{border-bottom:3px solid #3b220f}.cell.bl{border-left:3px solid #3b220f}.cell.br{border-right:3px solid #3b220f}.cell.q{filter:saturate(1.15)}.cell.bad{box-shadow:inset 0 0 0 4px #dc2626}.cell.mark{font-size:clamp(1rem,6vw,2rem);color:#7c2d12}.status{text-align:center;font-weight:900;min-height:28px;margin:10px 0;color:#c2410c}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.actions button{min-height:48px;border-radius:14px;border:1px solid #fdba74;background:#fff7ed;color:#9a3412;font:800 .9rem system-ui}.actions .primary{background:#f97316;color:#fff;border-color:#f97316}.help{font-size:.76rem;text-align:center;margin-top:10px;color:#8a4b27}.stars{text-align:center;font-size:1.25rem;letter-spacing:3px;margin:4px 0 8px}.result{display:none;background:#fff7ed;border:1px solid #fdba74;border-radius:16px;padding:12px;text-align:center;margin:10px 0;font-weight:800}.result.show{display:block}.result strong{color:#f97316;font-size:1.15rem}@media(max-width:480px){.top{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.app{padding:12px}.actions{grid-template-columns:1fr 1fr}.actions .hint{grid-column:1/-1}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>👑 Queens</h1><p>Una reina por fila, columna y región. Las reinas no pueden tocarse, ni siquiera en diagonal.</p><div class="top"><span class="badge">Nivel<b id="levelLabel">1</b></span><span class="badge">Tiempo<b id="timer">00:00</b></span><span class="badge">Mejor<b id="best">—</b></span><span class="badge">Pistas<b id="hints">0</b></span></div><div class="levels" id="levels"></div><div class="stars" id="stars">☆☆☆</div><section class="board" id="board"></section><div class="status" id="status">Toca: vacío → ❌ → 👑</div><div class="result" id="result"></div><div class="actions"><button class="primary" id="check">Comprobar</button><button id="clear">Limpiar</button><button class="hint" id="hint">Pista (-1 ⭐)</button></div><div class="help">Los 20 tableros tienen regiones contiguas y una única solución. Completa un nivel para desbloquear el siguiente.</div></main><script>const puzzles=[{"n":5,"sol":[4,2,0,3,1],"r":["11100","21111","22222","22233","24233"]},{"n":5,"sol":[1,4,2,0,3],"r":["00111","20211","22211","32244","33444"]},{"n":5,"sol":[3,0,2,4,1],"r":["10000","10000","12233","22233","44233"]},{"n":5,"sol":[4,1,3,0,2],"r":["11110","11122","33222","33322","33444"]},{"n":5,"sol":[1,3,0,2,4],"r":["00111","20011","20011","23333","23344"]},{"n":6,"sol":[3,0,2,4,1,5],"r":["100000","111100","112200","442333","442233","442235"]},{"n":6,"sol":[3,5,1,4,2,0],"r":["220000","220011","220033","244033","444333","544333"]},{"n":6,"sol":[4,1,3,5,2,0],"r":["000003","111103","111223","111233","114433","554333"]},{"n":6,"sol":[2,0,3,5,1,4],"r":["100000","100005","111255","141253","444453","444555"]},{"n":6,"sol":[2,5,3,1,4,0],"r":["200011","200111","222211","332244","544444","544444"]},{"n":6,"sol":[0,3,1,4,2,5],"r":["022113","422133","422133","444433","444333","443335"]},{"n":6,"sol":[0,2,4,1,5,3],"r":["001222","331222","332222","334422","355444","555554"]},{"n":7,"sol":[1,5,0,2,4,6,3],"r":["0011111","0011111","2233311","3333444","3366455","3366655","6666665"]},{"n":7,"sol":[0,2,4,1,5,3,6],"r":["0011111","1111122","3332222","3332222","5332546","5535566","5555566"]},{"n":7,"sol":[4,6,3,1,5,2,0],"r":["3322011","3222111","3222111","3344444","5554444","5554444","6555544"]},{"n":7,"sol":[5,3,0,4,2,6,1],"r":["2220000","2241000","2444433","2244333","6644433","6646665","6666655"]},{"n":7,"sol":[6,4,2,5,1,3,0],"r":["2211110","2222111","2222131","6222333","6425333","6665553","6655553"]},{"n":7,"sol":[1,3,0,4,6,2,5],"r":["2001144","2111144","2221144","2222344","5554444","5555566","5555566"]},{"n":7,"sol":[5,3,6,0,2,4,1],"r":["3300000","3331100","3411102","3444555","4445555","6666555","6666555"]},{"n":7,"sol":[3,0,2,4,6,1,5],"r":["1110004","1110004","1122044","1123344","5555644","5555666","5555666"]}];const B=document.getElementById('board'),L=document.getElementById('levels'),S=document.getElementById('status'),HL=document.getElementById('hints'),LL=document.getElementById('levelLabel'),ST=document.getElementById('stars'),TM=document.getElementById('timer'),BEST=document.getElementById('best'),RES=document.getElementById('result');const palette=['#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff','#ffc6ff','#ffadad','#a0c4ff'];let level=0,marks=[],hints=0,startedAt=0,tickId=null,finished=false,unlocked=Math.max(1,Math.min(20,+localStorage.getItem('queensUnlocked')||1));function p(){return puzzles[level]}function region(r,c){return +p().r[r][c]}function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function elapsed(){return(performance.now()-startedAt)/1000}function bestKey(){return'queensBest'+(level+1)}function updateBest(){const v=+localStorage.getItem(bestKey());BEST.textContent=v?fmt(v):'—'}function runTimer(){clearInterval(tickId);tickId=setInterval(()=>{if(!finished)TM.textContent=fmt(elapsed())},250)}function drawLevels(){L.innerHTML='';for(let i=0;i<20;i++){const b=document.createElement('button');b.className='lv'+(i===level?' active':'')+(i+1>unlocked?' lock':'');b.textContent=i+1;b.disabled=i+1>unlocked;b.onclick=()=>{level=i;start()};L.appendChild(b)}}function start(){clearInterval(tickId);marks=Array(p().n*p().n).fill(0);hints=0;finished=false;startedAt=performance.now();HL.textContent=0;LL.textContent=(level+1)+' · '+p().n+'×'+p().n;S.textContent='Toca: vacío → ❌ → 👑';ST.textContent='☆☆☆';TM.textContent='00:00';RES.className='result';RES.textContent='';updateBest();render();drawLevels();runTimer()}function borderClass(r,c){const n=p().n,z=region(r,c);let s='';if(r>0&&region(r-1,c)!==z)s+=' bt';if(r<n-1&&region(r+1,c)!==z)s+=' bb';if(c>0&&region(r,c-1)!==z)s+=' bl';if(c<n-1&&region(r,c+1)!==z)s+=' br';return s}function render(){const n=p().n;B.innerHTML='';B.style.gridTemplateColumns=`repeat(${n},1fr)`;for(let r=0;r<n;r++)for(let c=0;c<n;c++){const i=r*n+c,b=document.createElement('button');b.className='cell'+borderClass(r,c)+(marks[i]===1?' mark':marks[i]===2?' q':'');b.style.background=palette[region(r,c)%palette.length];b.textContent=marks[i]===1?'×':marks[i]===2?'♛':'';b.disabled=finished;b.onpointerup=e=>{e.preventDefault();marks[i]=(marks[i]+1)%3;render()};B.appendChild(b)}}function queens(){const n=p().n,q=[];marks.forEach((m,i)=>{if(m===2)q.push([Math.floor(i/n),i%n,i])});return q}function valid(show){const n=p().n,q=queens(),bad=new Set(),reg=new Map;for(let a=0;a<q.length;a++)for(let b=a+1;b<q.length;b++){const[x,y,i]=q[a],[u,v,j]=q[b];if(x===u||y===v||(Math.abs(x-u)===1&&Math.abs(y-v)===1)){bad.add(i);bad.add(j)}}for(const[r,c,i]of q){const z=region(r,c);if(reg.has(z)){bad.add(i);bad.add(reg.get(z))}else reg.set(z,i)}if(show)[...B.children].forEach((x,i)=>x.classList.toggle('bad',bad.has(i)));return bad.size===0&&q.length===n&&new Set(q.map(x=>x[0])).size===n&&new Set(q.map(x=>x[1])).size===n&&reg.size===n}function finishLevel(){finished=true;clearInterval(tickId);const sec=Math.max(1,Math.round(elapsed())),old=+localStorage.getItem(bestKey()),isBest=!old||sec<old;if(isBest)localStorage.setItem(bestKey(),sec);TM.textContent=fmt(sec);updateBest();const stars=Math.max(1,3-hints),score=Math.max(100,1600-Math.round(sec*2.5)-hints*175);ST.textContent='★'.repeat(stars)+'☆'.repeat(3-stars);RES.className='result show';RES.innerHTML='<strong>'+fmt(sec)+'</strong> · '+stars+'★ · '+score+' puntos'+(isBest?' · 🏆 Nuevo récord':'');S.textContent='🎉 ¡Nivel completado!';if(level+1===unlocked&&unlocked<20){unlocked++;localStorage.setItem('queensUnlocked',unlocked);drawLevels()}render();if(level<19)setTimeout(()=>{level++;start()},1400)}document.getElementById('check').onclick=()=>{if(finished)return;if(valid(true))finishLevel();else S.textContent='Aún no. Revisa filas, columnas, regiones y diagonales.'};document.getElementById('clear').onclick=()=>{if(finished)return;marks.fill(0);S.textContent='Tablero limpio';render()};document.getElementById('hint').onclick=()=>{if(finished)return;const n=p().n,missing=[];for(let r=0;r<n;r++){const i=r*n+p().sol[r];if(marks[i]!==2)missing.push(i)}if(!missing.length)return;const i=missing[Math.floor(Math.random()*missing.length)];marks[i]=2;hints++;HL.textContent=hints;ST.textContent='★'.repeat(Math.max(1,3-hints))+'☆'.repeat(Math.min(2,hints));S.textContent='Pista usada: una reina revelada.';render()};start();</script></body></html>
