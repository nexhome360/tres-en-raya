<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Queens</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;color:#7c2d12;padding:12px;touch-action:manipulation}.app{width:min(100%,620px);margin:auto;background:#fff;border-radius:24px;padding:16px;box-shadow:0 20px 60px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:8px 0 3px;color:#f97316;font-size:clamp(2rem,10vw,3.5rem)}p{margin:0 0 12px;color:#9a5a2e}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.badge{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:7px 8px;font-size:.72rem;font-weight:800;text-align:center}.badge b{display:block;font-size:1rem;color:#c2410c;margin-top:2px}.levels{display:flex;gap:6px;overflow-x:auto;padding:3px 0 10px}.lv{min-width:42px;height:42px;border-radius:12px;border:1px solid #fdba74;background:#fff7ed;color:#c2410c;font-weight:900}.lv.active{background:#f97316;color:#fff}.lv.lock{opacity:.35}.board{display:grid;width:100%;aspect-ratio:1;border:3px solid #7c2d12;border-radius:12px;overflow:hidden;user-select:none}.cell{border:0;border-right:1px solid #ffffff99;border-bottom:1px solid #ffffff99;padding:0;font-size:clamp(1.3rem,8vw,2.6rem);font-weight:900;display:grid;place-items:center;touch-action:manipulation;color:#7c2d12}.cell.q{filter:saturate(1.1)}.cell.bad{outline:4px solid #dc2626;outline-offset:-4px}.cell.mark{font-size:clamp(1rem,6vw,2rem);color:#9a3412}.status{text-align:center;font-weight:900;min-height:28px;margin:10px 0;color:#c2410c}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.actions button{min-height:48px;border-radius:14px;border:1px solid #fdba74;background:#fff7ed;color:#9a3412;font:800 .9rem system-ui}.actions .primary{background:#f97316;color:#fff;border-color:#f97316}.help{font-size:.76rem;text-align:center;margin-top:10px;color:#9a5a2e}.stars{text-align:center;font-size:1.25rem;letter-spacing:3px;margin:4px 0 8px}.result{display:none;background:#fff7ed;border:1px solid #fdba74;border-radius:16px;padding:12px;text-align:center;margin:10px 0;font-weight:800}.result.show{display:block}.result strong{color:#f97316;font-size:1.15rem}@media(max-width:480px){.top{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.app{padding:12px}.actions{grid-template-columns:1fr 1fr}.actions .hint{grid-column:1/-1}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>👑 Queens</h1><p>Una reina por fila, columna y región. Las reinas no pueden tocarse.</p><div class="top"><span class="badge">Nivel<b id="levelLabel">1</b></span><span class="badge">Tiempo<b id="timer">00:00</b></span><span class="badge">Mejor<b id="best">—</b></span><span class="badge">Pistas<b id="hints">0</b></span></div><div class="levels" id="levels"></div><div class="stars" id="stars">☆☆☆</div><section class="board" id="board"></section><div class="status" id="status">Toca: vacío → ❌ → 👑</div><div class="result" id="result"></div><div class="actions"><button class="primary" id="check">Comprobar</button><button id="clear">Limpiar</button><button class="hint" id="hint">Pista (-1 ⭐)</button></div><div class="help">Completa un nivel para desbloquear el siguiente. Se guarda tu mejor tiempo por nivel. Las pistas revelan una reina y reducen la puntuación.</div></main><script>const B=document.getElementById('board'),L=document.getElementById('levels'),S=document.getElementById('status'),HL=document.getElementById('hints'),LL=document.getElementById('levelLabel'),ST=document.getElementById('stars'),TM=document.getElementById('timer'),BEST=document.getElementById('best'),RES=document.getElementById('result');const palette=['#ffedd5','#fed7aa','#fdba74','#fb923c','#fca5a5','#fecaca','#fde68a','#fef3c7','#bbf7d0','#bfdbfe'];let level=0,marks=[],hints=0,startedAt=0,tickId=null,finished=false,unlocked=Math.max(1,Math.min(20,+localStorage.getItem('queensUnlocked')||1));function makePuzzle(idx){const n=idx<4?5:idx<10?6:idx<16?7:8;const shifts=[2,3,2,3,4,2,3,4,5,2,3,4,5,3,4,5,6,3,5,6];let k=shifts[idx];while(gcd(k,n)!==1)k++;const sol=Array.from({length:n},(_,r)=>(r*k+(idx*2+1))%n);const regions=Array.from({length:n},()=>Array(n));for(let r=0;r<n;r++)for(let c=0;c<n;c++){const d=Math.abs(c-sol[r]);let owner=r;if(d>0){const bias=(r+c+idx)%3;if(bias===0&&r>0)owner=r-1;else if(bias===1&&r<n-1)owner=r+1}regions[r][c]=owner}for(let r=0;r<n;r++)regions[r][sol[r]]=r;return{n,sol,regions}}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function elapsed(){return (performance.now()-startedAt)/1000}function bestKey(){return 'queensBest'+(level+1)}function updateBest(){const v=+localStorage.getItem(bestKey());BEST.textContent=v?fmt(v):'—'}function runTimer(){clearInterval(tickId);tickId=setInterval(()=>{if(!finished)TM.textContent=fmt(elapsed())},250)}function drawLevels(){L.innerHTML='';for(let i=0;i<20;i++){const b=document.createElement('button');b.className='lv'+(i===level?' active':'')+(i+1>unlocked?' lock':'');b.textContent=i+1;b.disabled=i+1>unlocked;b.onclick=()=>{level=i;start()};L.appendChild(b)}}function start(){clearInterval(tickId);const p=makePuzzle(level);marks=Array(p.n*p.n).fill(0);hints=0;finished=false;startedAt=performance.now();HL.textContent=0;LL.textContent=(level+1)+' · '+p.n+'×'+p.n;S.textContent='Toca: vacío → ❌ → 👑';ST.textContent='☆☆☆';TM.textContent='00:00';RES.className='result';RES.textContent='';updateBest();render();drawLevels();runTimer()}function render(){const p=makePuzzle(level);B.innerHTML='';B.style.gridTemplateColumns=`repeat(${p.n},1fr)`;for(let r=0;r<p.n;r++)for(let c=0;c<p.n;c++){const i=r*p.n+c,b=document.createElement('button');b.className='cell'+(marks[i]===1?' mark':marks[i]===2?' q':'');b.style.background=palette[p.regions[r][c]%palette.length];b.textContent=marks[i]===1?'×':marks[i]===2?'♛':'';b.disabled=finished;b.onpointerup=e=>{e.preventDefault();marks[i]=(marks[i]+1)%3;render()};B.appendChild(b)}}function queens(){const p=makePuzzle(level),q=[];marks.forEach((m,i)=>{if(m===2)q.push([Math.floor(i/p.n),i%p.n,i])});return q}function valid(show){const p=makePuzzle(level),q=queens(),bad=new Set();for(let a=0;a<q.length;a++)for(let b=a+1;b<q.length;b++){const[x,y,i]=q[a],[u,v,j]=q[b];if(x===u||y===v||(Math.abs(x-u)===1&&Math.abs(y-v)===1)){bad.add(i);bad.add(j)}}const reg=new Map;for(const[r,c,i]of q){const z=p.regions[r][c];if(reg.has(z)){bad.add(i);bad.add(reg.get(z))}else reg.set(z,i)}if(show){[...B.children].forEach((x,i)=>x.classList.toggle('bad',bad.has(i)))}return bad.size===0&&q.length===p.n&&new Set(q.map(x=>x[0])).size===p.n&&new Set(q.map(x=>x[1])).size===p.n&&reg.size===p.n}function finishLevel(){finished=true;clearInterval(tickId);const sec=Math.max(1,Math.round(elapsed()));TM.textContent=fmt(sec);const old=+localStorage.getItem(bestKey());const isBest=!old||sec<old;if(isBest)localStorage.setItem(bestKey(),sec);updateBest();const stars=Math.max(1,3-hints);ST.textContent='★'.repeat(stars)+'☆'.repeat(3-stars);const speedBonus=Math.max(0,600-sec*2);const score=Math.max(100,1000+speedBonus-hints*150);RES.className='result show';RES.innerHTML='<strong>'+fmt(sec)+'</strong> · '+stars+'★ · '+score+' puntos'+(isBest?' · 🏆 Nuevo récord':'');S.textContent='🎉 ¡Nivel completado!';if(level+1===unlocked&&unlocked<20){unlocked++;localStorage.setItem('queensUnlocked',unlocked);drawLevels()}render();if(level<19)setTimeout(()=>{level++;start()},1400)}document.getElementById('check').onclick=()=>{if(finished)return;if(valid(true))finishLevel();else S.textContent='Aún no. Las casillas rojas tienen conflicto.'};document.getElementById('clear').onclick=()=>{if(finished)return;marks.fill(0);S.textContent='Tablero limpio';render()};document.getElementById('hint').onclick=()=>{if(finished)return;const p=makePuzzle(level),missing=[];for(let r=0;r<p.n;r++){const i=r*p.n+p.sol[r];if(marks[i]!==2)missing.push(i)}if(!missing.length)return;const i=missing[Math.floor(Math.random()*missing.length)];marks[i]=2;hints++;HL.textContent=hints;ST.textContent='★'.repeat(Math.max(1,3-hints))+'☆'.repeat(Math.min(2,hints));S.textContent='Pista usada: una reina revelada.';render()};start();</script></body></html>
