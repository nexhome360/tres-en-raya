<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Guitarra Mágica</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,620px);background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 70px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 4px;color:#f97316;font-size:clamp(2rem,10vw,3.4rem)}h2{color:#c2410c;margin:20px 0 8px}p{margin:0 0 16px;color:#9a5a2e}.guitar{background:#8a3a00;border-radius:28px;padding:18px 14px;display:grid;gap:10px}.string{min-height:54px;border:0;border-radius:999px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui;position:relative;overflow:hidden;touch-action:manipulation}.string:before{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:#fdba74}.string span{position:relative;background:#fff7ed;padding:3px 10px;border-radius:999px}.string:active,.string.on{transform:scale(.98);background:#ffedd5}.chords{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.chord,.action,select{min-height:50px;border:1px solid #fdba74;border-radius:14px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui}.lesson{margin-top:18px;padding:16px;background:#fff7ed;border-radius:20px;border:1px solid #fed7aa}.lessonTop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.lesson select{width:100%;padding:0 10px}.stats{font-size:.82rem;font-weight:800;color:#c2410c;text-align:right}.target{text-align:center;font-weight:800;margin:12px 0 8px}.target strong{font-size:2.4rem;color:#f97316;display:block}.rhythm{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0 14px}.beat{width:18px;height:18px;border-radius:50%;background:#fed7aa;border:2px solid #fdba74}.beat.on{background:#f97316;transform:scale(1.3)}.tempo{display:flex;justify-content:center;gap:8px;align-items:center;font-size:.8rem;font-weight:800;margin-bottom:10px}.tempo select{min-height:38px}.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.noteBtn{min-height:66px;border:2px solid #fdba74;border-radius:16px;background:#fff;color:#c2410c;font:900 1.25rem system-ui;touch-action:manipulation}.noteBtn:active{transform:scale(.96);background:#ffedd5}.noteBtn.next{outline:4px solid #fb923c}.noteBtn.pulse{animation:pulse .34s ease}@keyframes pulse{50%{transform:scale(1.08);background:#ffedd5}}.progress{height:10px;background:#fed7aa;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#f97316;transition:width .2s}.lessonActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action.primary{background:#f97316;color:#fff;border-color:#f97316}.feedback{text-align:center;min-height:24px;font-weight:800;color:#c2410c;margin-top:10px}.small{font-size:.76rem;text-align:center;color:#9a5a2e;margin-top:10px}@media(max-width:440px){.app{padding:14px}.lessonTop{grid-template-columns:1fr}.stats{text-align:center}.lessonActions{grid-template-columns:1fr}.noteBtn{min-height:58px}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>🎸 Guitarra Mágica</h1><p>Aprende las notas tocando canciones y siguiendo el pulso.</p><section class="guitar" id="guitar"></section><div class="chords"><button class="chord" data-chord="C">Do</button><button class="chord" data-chord="G">Sol</button><button class="chord" data-chord="Am">La m</button></div><section class="lesson"><h2>🎵 Aprende tocando</h2><div class="lessonTop"><select id="song"><option value="twinkle">Estrellita</option><option value="ode">Oda a la alegría</option><option value="frere">Frère Jacques</option><option value="mary">Mary Had a Little Lamb</option><option value="bells">Jingle Bells</option><option value="birthday">Cumpleaños feliz</option><option value="row">Row, Row, Row Your Boat</option><option value="london">London Bridge</option></select><div class="stats">Errores <span id="errors">0</span> · Ritmo <span id="rhythmScore">100</span>%</div></div><div class="target">Siguiente nota<strong id="target">DO</strong><span id="counter"></span></div><div class="rhythm"><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div><div class="tempo">Velocidad <select id="tempo"><option value="900">Lenta</option><option value="700" selected>Normal</option><option value="520">Rápida</option></select></div><div class="notes" id="notes"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="lessonActions"><button class="action primary" id="metronome">▶ Seguir ritmo</button><button class="action" id="restart">Reiniciar</button><button class="action" id="listen">Pista (+2 errores)</button></div><div class="feedback" id="feedback"></div><div class="small">El botón correcto se ilumina. Con “Seguir ritmo”, intenta tocar cuando pulse el círculo naranja: así practicas nota y tiempo a la vez.</div></section></main><script>const strings=[['Mi agudo',329.63],['Si',246.94],['Sol',196],['Re',146.83],['La',110],['Mi grave',82.41]],G=document.getElementById('guitar');let ctx;function audio(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(freq,d=.65,vol=.2,type='triangle'){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}strings.forEach(([name,f])=>{const b=document.createElement('button');b.className='string';b.innerHTML='<span>'+name+'</span>';b.onpointerdown=e=>{e.preventDefault();b.classList.add('on');tone(f)};b.onpointerup=()=>b.classList.remove('on');G.appendChild(b)});const chords={C:[130.81,164.81,196,261.63,329.63],G:[98,146.83,196,246.94,392],Am:[110,164.81,220,261.63,329.63]};document.querySelectorAll('.chord').forEach(b=>b.onpointerdown=()=>chords[b.dataset.chord].forEach((f,i)=>setTimeout(()=>tone(f,.8,.12),i*45)));const freq={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,C2:523.25},names={C:'DO',D:'RE',E:'MI',F:'FA',G:'SOL',A:'LA',B:'SI',C2:'DO ↑'};const songs={twinkle:['C','C','G','G','A','A','G','F','F','E','E','D','D','C','G','G','F','F','E','E','D','G','G','F','F','E','E','D','C','C','G','G','A','A','G','F','F','E','E','D','D','C'],ode:['E','E','F','G','G','F','E','D','C','C','D','E','E','D','D','E','E','F','G','G','F','E','D','C','C','D','E','D','C','C','D','D','E','C','D','E','F','E','C','D','E','F','E','D','C','D','G','E','E','F','G','G','F','E','D','C','C','D','E','D','C','C'],frere:['C','D','E','C','C','D','E','C','E','F','G','E','F','G','G','A','G','F','E','C','G','A','G','F','E','C','C','G','C','C','G','C'],mary:['E','D','C','D','E','E','E','D','D','D','E','G','G','E','D','C','D','E','E','E','E','D','D','E','D','C'],bells:['E','E','E','E','E','E','E','G','C','D','E','F','F','F','F','F','E','E','E','E','D','D','E','D','G','E','E','E','E','E','E','E','G','C','D','E','F','F','F','F','F','E','E','E','G','G','F','D','C'],birthday:['G','G','A','G','C2','B','G','G','A','G','D','C','G','G','G','E','C2','B','A','F','F','E','C','D','C'],row:['C','C','C','D','E','E','D','E','F','G','C2','C2','C2','G','G','G','E','E','E','C','C','C','G','F','E','D','C'],london:['G','A','G','F','E','F','G','D','E','F','E','F','G','G','A','G','F','E','F','G','D','G','E','C']};const order=['C','D','E','F','G','A','B','C2'],N=document.getElementById('notes'),songEl=document.getElementById('song'),target=document.getElementById('target'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),errorsEl=document.getElementById('errors'),rhythmEl=document.getElementById('rhythmScore'),feedback=document.getElementById('feedback'),beats=[...document.querySelectorAll('.beat')],tempoEl=document.getElementById('tempo'),metro=document.getElementById('metronome');let list=[],pos=0,errors=0,rhythmHits=[],running=false,timer=null,nextBeat=0,beatNo=0;order.forEach(n=>{const b=document.createElement('button');b.className='noteBtn';b.textContent=names[n];b.dataset.note=n;b.onpointerdown=e=>{e.preventDefault();hit(n,b)};N.appendChild(b)});function load(){stop();list=songs[songEl.value];pos=0;errors=0;rhythmHits=[];errorsEl.textContent=0;rhythmEl.textContent=100;feedback.textContent='';update()}function update(){const done=pos>=list.length;target.textContent=done?'🎉':names[list[pos]];counter.textContent=done?'¡Canción terminada!':`${pos+1} / ${list.length}`;bar.style.width=(100*pos/list.length)+'%';[...N.children].forEach(b=>b.classList.toggle('next',!done&&b.dataset.note===list[pos]));if(done){stop();bar.style.width='100%';feedback.textContent=`¡Terminada! ${errors} errores · ritmo ${scoreRhythm()}%`}}function scoreRhythm(){if(!rhythmHits.length)return 100;return Math.max(0,Math.round(100-rhythmHits.reduce((a,b)=>a+b,0)/rhythmHits.length/4))}function hit(n,b){tone(freq[n]);if(pos>=list.length)return;if(n!==list[pos]){errors++;errorsEl.textContent=errors;feedback.textContent='Esa no era. Mira la nota marcada.';return}if(running&&nextBeat){const delta=Math.abs(performance.now()-nextBeat);rhythmHits.push(delta);rhythmEl.textContent=scoreRhythm();feedback.textContent=delta<180?'¡Clavada al ritmo!':delta<330?'Bien, casi al pulso.':'Nota correcta; intenta seguir el pulso.'}else feedback.textContent='¡Nota correcta!';pos++;b.classList.remove('pulse');update()}function tick(){if(!running)return;const ms=+tempoEl.value;beatNo=(beatNo+1)%4;beats.forEach((x,i)=>x.classList.toggle('on',i===beatNo));tone(880,.06,.035,'sine');nextBeat=performance.now();if(pos<list.length){const b=[...N.children].find(x=>x.dataset.note===list[pos]);if(b){b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}}timer=setTimeout(tick,ms)}function startMetro(){if(running){stop();return}audio();running=true;metro.textContent='■ Parar ritmo';beatNo=-1;tick()}function stop(){running=false;clearTimeout(timer);timer=null;nextBeat=0;beats.forEach(x=>x.classList.remove('on'));if(metro)metro.textContent='▶ Seguir ritmo'}function hint(){if(pos>=list.length)return;errors+=2;errorsEl.textContent=errors;feedback.textContent='Pista: +2 errores';for(let i=pos;i<Math.min(pos+5,list.length);i++)setTimeout(()=>tone(freq[list[i]],.5,.14),(i-pos)*420)}songEl.onchange=load;tempoEl.onchange=()=>{if(running){stop();startMetro()}};metro.onclick=startMetro;document.getElementById('restart').onclick=load;document.getElementById('listen').onclick=hint;load();</script></body></html>
