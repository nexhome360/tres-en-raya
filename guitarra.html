<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Guitarra Mágica</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,600px);background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 70px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 4px;color:#f97316;font-size:clamp(2rem,10vw,3.4rem)}h2{color:#c2410c;margin:20px 0 8px}p{margin:0 0 16px;color:#9a5a2e}.guitar{background:#8a3a00;border-radius:28px;padding:18px 14px;display:grid;gap:10px}.string{min-height:58px;border:0;border-radius:999px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui;position:relative;overflow:hidden;touch-action:manipulation}.string:before{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:#fdba74;border-radius:10px}.string span{position:relative;background:#fff7ed;padding:3px 10px;border-radius:999px}.string:active,.string.on{transform:scale(.98);background:#ffedd5}.chords{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.chord,.action,select{min-height:52px;border:1px solid #fdba74;border-radius:14px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui}.chord:active,.action:active{background:#ffedd5}.lesson{margin-top:18px;padding:16px;background:#fff7ed;border-radius:20px;border:1px solid #fed7aa}.lessonTop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.lesson select{width:100%;padding:0 10px}.stats{font-size:.84rem;font-weight:800;color:#c2410c;white-space:nowrap}.target{text-align:center;font-size:1rem;font-weight:800;margin:14px 0 10px}.target strong{font-size:2.2rem;color:#f97316;display:block}.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.noteBtn{min-height:66px;border:2px solid #fdba74;border-radius:16px;background:#fff;color:#c2410c;font:900 1.3rem system-ui;touch-action:manipulation}.noteBtn:active{transform:scale(.96);background:#ffedd5}.noteBtn.next{outline:4px solid #fb923c}.progress{height:10px;background:#fed7aa;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#f97316;transition:width .2s}.lessonActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action.primary{background:#f97316;color:#fff;border-color:#f97316}.feedback{text-align:center;min-height:24px;font-weight:800;color:#c2410c;margin-top:10px}.note{font-size:.8rem;text-align:center;margin-top:12px;color:#9a5a2e}@media(max-width:420px){.app{padding:14px}.string{min-height:54px}.notes{grid-template-columns:repeat(4,1fr)}.noteBtn{min-height:58px}.lessonTop{grid-template-columns:1fr}.stats{text-align:center}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>🎸 Guitarra Mágica</h1><p>Toca las cuerdas, prueba acordes o aprende una melodía paso a paso.</p><section class="guitar" id="guitar"></section><div class="chords"><button class="chord" data-chord="C">Do</button><button class="chord" data-chord="G">Sol</button><button class="chord" data-chord="Am">La m</button></div><section class="lesson"><h2>🎵 Aprende una canción</h2><div class="lessonTop"><select id="song"><option value="twinkle">Estrellita</option><option value="ode">Oda a la alegría</option><option value="frere">Frère Jacques</option><option value="mary">Mary Had a Little Lamb</option></select><div class="stats">Errores: <span id="errors">0</span></div></div><div class="target">Toca esta nota:<strong id="target">DO</strong><span id="counter">1 / 14</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="notes" id="notes"></div><div class="lessonActions"><button class="action primary" id="restart">Empezar de nuevo</button><button class="action" id="listen">Escuchar pista (+2 errores)</button></div><div class="feedback" id="feedback"></div></section><div class="note">Las melodías del modo aprendizaje son tradicionales o de dominio público. El sonido empieza al primer toque, como requiere el móvil.</div></main><script>const strings=[['Mi agudo',329.63],['Si',246.94],['Sol',196],['Re',146.83],['La',110],['Mi grave',82.41]],G=document.getElementById('guitar');let ctx;function audio(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function pluck(freq,d=.75,vol=.22){const c=audio(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.value=freq;f.type='lowpass';f.frequency.value=2200;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(f);f.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}strings.forEach(([name,f])=>{const b=document.createElement('button');b.className='string';b.innerHTML='<span>'+name+'</span>';b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');pluck(f)});b.addEventListener('pointerup',()=>b.classList.remove('on'));b.addEventListener('pointercancel',()=>b.classList.remove('on'));G.appendChild(b)});const chords={C:[130.81,164.81,196,261.63,329.63],G:[98,146.83,196,246.94,392],Am:[110,164.81,220,261.63,329.63]};document.querySelectorAll('.chord').forEach(b=>b.addEventListener('pointerdown',()=>{chords[b.dataset.chord].forEach((f,i)=>setTimeout(()=>pluck(f,.9,.13),i*55))}));const freq={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,C2:523.25},names={C:'DO',D:'RE',E:'MI',F:'FA',G:'SOL',A:'LA',B:'SI',C2:'DO ↑'},songs={twinkle:{name:'Estrellita',seq:['C','C','G','G','A','A','G','F','F','E','E','D','D','C']},ode:{name:'Oda a la alegría',seq:['E','E','F','G','G','F','E','D','C','C','D','E','E','D','D']},frere:{name:'Frère Jacques',seq:['C','D','E','C','C','D','E','C','E','F','G','E','F','G']},mary:{name:'Mary Had a Little Lamb',seq:['E','D','C','D','E','E','E','D','D','D','E','G','G']}};const noteOrder=['C','D','E','F','G','A','B','C2'],N=document.getElementById('notes'),songEl=document.getElementById('song'),targetEl=document.getElementById('target'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),errorsEl=document.getElementById('errors'),feedback=document.getElementById('feedback');let pos=0,errors=0,list=[];noteOrder.forEach(n=>{const b=document.createElement('button');b.className='noteBtn';b.textContent=names[n];b.dataset.note=n;b.addEventListener('pointerdown',e=>{e.preventDefault();playLessonNote(n,b)});N.appendChild(b)});function loadSong(){list=songs[songEl.value].seq;pos=0;errors=0;errorsEl.textContent='0';feedback.textContent='';updateLesson()}function updateLesson(){const done=pos>=list.length;targetEl.textContent=done?'🎉':names[list[pos]];counter.textContent=done?'¡Terminada!':(pos+1)+' / '+list.length;bar.style.width=((pos/list.length)*100)+'%';[...N.children].forEach(b=>b.classList.toggle('next',!done&&b.dataset.note===list[pos]));if(done){bar.style.width='100%';feedback.textContent=errors===0?'¡Perfecta, sin errores! 🌟':'¡Muy bien! Errores: '+errors}}function playLessonNote(n,b){pluck(freq[n],.65,.2);if(pos>=list.length)return;if(n===list[pos]){feedback.textContent='¡Bien!';pos++;updateLesson()}else{errors++;errorsEl.textContent=errors;feedback.textContent='Casi. Prueba otra nota.';b.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:180})}}function listenHint(){if(pos>=list.length)return;errors+=2;errorsEl.textContent=errors;feedback.textContent='Pista usada: +2 errores';const end=Math.min(pos+4,list.length);for(let i=pos;i<end;i++)setTimeout(()=>pluck(freq[list[i]],.55,.16),(i-pos)*420)}songEl.addEventListener('change',loadSong);document.getElementById('restart').addEventListener('click',loadSong);document.getElementById('listen').addEventListener('click',listenHint);loadSong();</script></body></html>
