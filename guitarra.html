<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Guitarra Mágica</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,560px);background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 70px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 4px;color:#f97316;font-size:clamp(2rem,10vw,3.4rem)}p{margin:0 0 16px;color:#9a5a2e}.guitar{background:#8a3a00;border-radius:28px;padding:18px 14px;display:grid;gap:10px}.string{min-height:58px;border:0;border-radius:999px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui;position:relative;overflow:hidden;touch-action:manipulation}.string:before{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:#fdba74;border-radius:10px}.string span{position:relative;background:#fff7ed;padding:3px 10px;border-radius:999px}.string:active,.string.on{transform:scale(.98);background:#ffedd5}.chords{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.chord{min-height:52px;border:1px solid #fdba74;border-radius:14px;background:#fff7ed;color:#9a3412;font:800 1rem system-ui}.chord:active{background:#ffedd5}.note{font-size:.8rem;text-align:center;margin-top:12px;color:#9a5a2e}@media(max-width:420px){.app{padding:14px}.string{min-height:54px}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>🎸 Guitarra Mágica</h1><p>Toca las cuerdas o prueba un acorde. Sube el volumen.</p><section class="guitar" id="guitar"></section><div class="chords"><button class="chord" data-chord="C">Do</button><button class="chord" data-chord="G">Sol</button><button class="chord" data-chord="Am">La m</button></div><div class="note">El sonido empieza al primer toque, como requiere el móvil.</div></main><script>const strings=[['Mi agudo',329.63],['Si',246.94],['Sol',196],['Re',146.83],['La',110],['Mi grave',82.41]],G=document.getElementById('guitar');let ctx;function audio(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function pluck(freq,d=.8,vol=.22){const c=audio(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.value=freq;f.type='lowpass';f.frequency.value=2200;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(f);f.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}strings.forEach(([name,f],i)=>{const b=document.createElement('button');b.className='string';b.innerHTML='<span>'+name+'</span>';b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');pluck(f)});b.addEventListener('pointerup',()=>b.classList.remove('on'));b.addEventListener('pointercancel',()=>b.classList.remove('on'));G.appendChild(b)});const chords={C:[130.81,164.81,196,261.63,329.63],G:[98,146.83,196,246.94,392],Am:[110,164.81,220,261.63,329.63]};document.querySelectorAll('.chord').forEach(b=>b.addEventListener('pointerdown',()=>{const a=chords[b.dataset.chord];a.forEach((f,i)=>setTimeout(()=>pluck(f,.9,.13),i*55))}));</script></body></html>
