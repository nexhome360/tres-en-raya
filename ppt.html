<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Piedra Papel Tijera</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,520px);background:#fff;border-radius:24px;padding:18px}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 6px;color:#f97316}.sub{margin:0 0 14px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.score div{background:#fff7ed;border-radius:14px;text-align:center;padding:10px}.score b{display:block;font-size:1.4rem;color:#f97316}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices button{aspect-ratio:1;border-radius:18px;border:2px solid #fdba74;background:#fff7ed;font-size:2.5rem;touch-action:manipulation}.result{margin:14px 0;background:#fff7ed;border-radius:14px;padding:14px;text-align:center;font-weight:800;min-height:52px}.reset{width:100%;min-height:48px;border-radius:14px;border:1px solid #f97316;background:#f97316;color:#fff;font:inherit;font-weight:800}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>Piedra, Papel, Tijera</h1><p class="sub">Elige una opción y juega contra la máquina.</p><div class="score"><div><b id="you">0</b><span>Tú</span></div><div><b id="draw">0</b><span>Empates</span></div><div><b id="cpu">0</b><span>CPU</span></div></div><section class="choices"><button data-v="piedra">✊</button><button data-v="papel">✋</button><button data-v="tijera">✌️</button></section><div id="result" class="result">Haz tu jugada.</div><button id="reset" class="reset">Reiniciar marcador</button></main><script>const vals=['piedra','papel','tijera'],R=document.getElementById('result'),Y=document.getElementById('you'),C=document.getElementById('cpu'),D=document.getElementById('draw');let s={y:0,c:0,d:0};function play(v){const c=vals[Math.floor(Math.random()*3)];let txt;if(v===c){s.d++;txt='Empate: ambos '+v+'.'}else if((v==='piedra'&&c==='tijera')||(v==='papel'&&c==='piedra')||(v==='tijera'&&c==='papel')){s.y++;txt='¡Ganas! CPU eligió '+c+'.'}else{s.c++;txt='Gana CPU con '+c+'.'}Y.textContent=s.y;C.textContent=s.c;D.textContent=s.d;R.textContent=txt}[...document.querySelectorAll('[data-v]')].forEach(b=>b.addEventListener('pointerup',e=>{e.preventDefault();play(b.dataset.v)}));document.getElementById('reset').onclick=()=>{s={y:0,c:0,d:0};Y.textContent=C.textContent=D.textContent=0;R.textContent='Haz tu jugada.'};</script></body></html>
