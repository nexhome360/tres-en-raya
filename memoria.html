<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Memoria Naranja</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,520px);background:#fff;border-radius:24px;padding:18px}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 6px;color:#f97316}.sub{margin:0 0 14px}.stats{display:flex;justify-content:space-between;background:#fff7ed;padding:10px 12px;border-radius:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{aspect-ratio:1;border:2px solid #fdba74;border-radius:16px;background:#fff7ed;font-size:2rem;display:grid;place-items:center;touch-action:manipulation}.card.open,.card.done{background:#ffedd5}.card.done{outline:3px solid #f97316}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}button{font:inherit;min-height:48px;border-radius:14px;border:1px solid #fdba74;background:#fff7ed;color:#9a3412}.primary{background:#f97316;color:#fff;border-color:#f97316;font-weight:800}@media(max-width:420px){.app{padding:14px}.card{font-size:1.6rem}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>Memoria Naranja</h1><p class="sub">Encuentra todas las parejas.</p><div class="stats"><span>Movimientos: <b id="moves">0</b></span><span>Parejas: <b id="pairs">0</b>/8</span></div><section id="grid" class="grid"></section><div class="actions"><button class="primary" id="new">Nueva partida</button></div></main><script>const G=document.getElementById('grid'),M=document.getElementById('moves'),P=document.getElementById('pairs');const icons=['🍊','⭐','🎯','⚡','🎲','🚀','🔥','🎵'];let deck=[],open=[],moves=0,pairs=0,lock=false;function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5);open=[];moves=0;pairs=0;lock=false;M.textContent=0;P.textContent=0;G.innerHTML='';deck.forEach((v,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.dataset.i=i;b.addEventListener('pointerup',()=>flip(i,b));G.appendChild(b)})}function flip(i,el){if(lock||el.classList.contains('done')||el.classList.contains('open'))return;el.textContent=deck[i];el.classList.add('open');open.push({i,el});if(open.length===2){moves++;M.textContent=moves;const[a,b]=open;if(deck[a.i]===deck[b.i]){a.el.classList.replace('open','done');b.el.classList.replace('open','done');pairs++;P.textContent=pairs;open=[];if(pairs===8)setTimeout(()=>alert('¡Completado en '+moves+' movimientos!'),150)}else{lock=true;setTimeout(()=>{a.el.textContent='';b.el.textContent='';a.el.classList.remove('open');b.el.classList.remove('open');open=[];lock=false},650)}}}document.getElementById('new').onclick=start;start();</script></body></html>
