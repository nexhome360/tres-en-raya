<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Conquista Europa</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f97316;font-family:system-ui,-apple-system,sans-serif;color:#54260e;padding:12px}.app{max-width:720px;margin:auto;background:#fff;border-radius:24px;padding:16px}a{color:#c2410c;font-weight:800;text-decoration:none}h1{color:#f97316;margin:8px 0 4px;font-size:clamp(2rem,10vw,3.4rem)}p{color:#8a4b27;margin:0 0 12px}.setup{display:grid;grid-template-columns:1fr 1fr;gap:8px}.setup label{font-size:.78rem;font-weight:800;color:#9a3412}.setup select{width:100%;min-height:46px;margin-top:4px;border:1px solid #fdba74;border-radius:12px;background:#fff7ed;padding:0 8px;color:#7c2d12;font-weight:800}.start{grid-column:1/-1;min-height:50px;border:0;border-radius:14px;background:#f97316;color:#fff;font:900 1rem system-ui}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.badge{background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:7px;text-align:center;font-size:.7rem}.badge b{display:block;font-size:.95rem;color:#c2410c}.map{position:relative;width:100%;aspect-ratio:1.25;background:#e0f2fe;border:2px solid #7c2d12;border-radius:18px;overflow:hidden;touch-action:manipulation}.sea{position:absolute;inset:0;background:linear-gradient(145deg,#e0f2fe,#bae6fd)}.land{position:absolute;background:#ffedd5;border:2px solid #9a3412;border-radius:38% 46% 42% 36%;opacity:.9}.mainland{left:17%;top:12%;width:66%;height:75%;transform:rotate(-4deg)}.iberia{left:13%;top:62%;width:24%;height:24%;transform:rotate(12deg)}.italy{left:52%;top:62%;width:13%;height:27%;transform:rotate(-18deg)}.uk{left:20%;top:20%;width:12%;height:23%;transform:rotate(-12deg)}.scan{left:50%;top:2%;width:20%;height:31%;transform:rotate(12deg)}.territory{position:absolute;width:13%;min-width:48px;aspect-ratio:1;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;text-align:center;padding:2px;font-size:clamp(.55rem,2.4vw,.76rem);font-weight:900;box-shadow:0 2px 6px #0003;touch-action:manipulation}.territory b{display:block;font-size:1.05rem}.territory.me{background:#fb923c;color:#fff}.territory.ai{background:#64748b;color:#fff}.territory.neutral{background:#fff;color:#7c2d12}.territory.selected{outline:4px solid #7c2d12;transform:scale(1.08)}.territory.target{box-shadow:0 0 0 4px #fde68a}.panel{background:#fff7ed;border:1px solid #fdba74;border-radius:16px;padding:12px;margin-top:10px}.status{font-weight:800;text-align:center;min-height:42px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.actions button{min-height:46px;border:1px solid #fdba74;border-radius:12px;background:#fff;color:#9a3412;font-weight:900}.actions .primary{background:#f97316;color:#fff}.legend{text-align:center;font-size:.72rem;color:#8a4b27;margin-top:8px}.hidden{display:none}@media(max-width:480px){.setup{grid-template-columns:1fr}.start{grid-column:auto}.hud{grid-template-columns:1fr 1fr}.territory{width:14%;min-width:42px}.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>🌍 Conquista Europa</h1><p>Conquista rápida inspirada en los juegos de control territorial. Elige país y dificultad.</p><section class="setup" id="setup"><label>Tu país<select id="country"><option>España</option><option>Francia</option><option>Alemania</option><option>Italia</option><option>Reino Unido</option><option>Polonia</option><option>Suecia</option><option>Grecia</option></select></label><label>Dificultad<select id="difficulty"><option value="easy">Fácil</option><option value="normal" selected>Normal</option><option value="hard">Difícil</option><option value="expert">Experto</option></select></label><button class="start" id="start">Comenzar conquista</button></section><section id="game" class="hidden"><div class="hud"><span class="badge">Equipo<b id="team">España</b></span><span class="badge">Turno<b id="turn">1</b></span><span class="badge">Territorios<b id="owned">1 / 15</b></span><span class="badge">Refuerzos<b id="reinforce">3</b></span></div><div class="map" id="map"><div class="sea"></div><div class="land mainland"></div><div class="land iberia"></div><div class="land italy"></div><div class="land uk"></div><div class="land scan"></div></div><div class="panel"><div class="status" id="status">Selecciona uno de tus territorios.</div><div class="actions"><button id="add">+1 refuerzo</button><button class="primary" id="attack">Atacar seleccionado</button><button id="end">Terminar turno</button></div></div><div class="legend">🟠 Tú · ⚪ Neutral · ⚫ Rival. Objetivo: conquistar la capital rival ★ o controlar 10 territorios.</div></section></main><script>const data=[['Portugal',19,70],['España',27,66],['Francia',36,50],['Reino Unido',24,30],['Bélgica',42,43],['Alemania',51,42],['Italia',53,68],['Suecia',59,18],['Polonia',64,43],['Austria',55,53],['Chequia',60,49],['Rumanía',70,57],['Grecia',67,76],['Ucrania',78,46],['Noruega',49,14]],edges=[[0,1],[1,2],[2,3],[2,4],[2,6],[4,5],[5,7],[5,8],[5,9],[5,10],[6,9],[6,12],[8,10],[8,11],[8,13],[9,10],[10,11],[11,12],[11,13],[7,14],[5,14],[3,4]];const map=document.getElementById('map'),setup=document.getElementById('setup'),game=document.getElementById('game'),status=document.getElementById('status');let state=[],sel=-1,turn=1,reinf=3,diff='normal',playerCountry='España',aiCapital=13;function adj(a,b){return edges.some(e=>(e[0]===a&&e[1]===b)||(e[1]===a&&e[0]===b))}function start(){playerCountry=document.getElementById('country').value;diff=document.getElementById('difficulty').value;let startIdx=data.findIndex(x=>x[0]===playerCountry);if(startIdx<0)startIdx=1;state=data.map((x,i)=>({owner:'neutral',troops:2}));state[startIdx]={owner:'me',troops:5};aiCapital=[13,7,3,0].find(i=>i!==startIdx&&!adj(i,startIdx))??13;state[aiCapital]={owner:'ai',troops:5};const aiExtra=data.map((_,i)=>i).filter(i=>i!==startIdx&&i!==aiCapital).sort(()=>Math.random()-.5).slice(0,2);aiExtra.forEach(i=>state[i]={owner:'ai',troops:3});turn=1;reinf=3;sel=-1;setup.classList.add('hidden');game.classList.remove('hidden');document.getElementById('team').textContent=playerCountry;render();status.textContent='Selecciona uno de tus territorios y refuérzalo o ataca un vecino.'}function render(){map.querySelectorAll('.territory').forEach(x=>x.remove());state.forEach((s,i)=>{const b=document.createElement('button');b.className='territory '+s.owner+(i===sel?' selected':'');b.style.left=data[i][1]+'%';b.style.top=data[i][2]+'%';b.style.transform='translate(-50%,-50%)'+(i===sel?' scale(1.08)':'');b.innerHTML=data[i][0]+(i===aiCapital&&s.owner==='ai'?' ★':'')+'<b>'+s.troops+'</b>';b.addEventListener('click',()=>pick(i));map.appendChild(b)});document.getElementById('turn').textContent=turn;document.getElementById('owned').textContent=state.filter(x=>x.owner==='me').length+' / '+state.length;document.getElementById('reinforce').textContent=reinf}function pick(i){if(state[i].owner==='me'){sel=i;status.textContent=data[i][0]+': '+state[i].troops+' tropas. Puedes reforzar o atacar un territorio vecino.'}else if(sel>=0&&adj(sel,i)){fight(sel,i)}else status.textContent='Primero selecciona uno de tus territorios vecino.';render()}function fight(a,b){if(state[a].troops<2){status.textContent='Necesitas al menos 2 tropas para atacar.';return}const atk=Math.min(3,state[a].troops-1),def=Math.min(2,state[b].troops);const ap=atk*(.65+Math.random()*.7),dp=def*(.65+Math.random()*.7);if(ap>dp){state[a].troops-=atk;state[b].owner='me';state[b].troops=Math.max(1,atk-Math.floor(def/2));status.textContent='⚔️ ¡Conquistaste '+data[b][0]+'!'}else{state[a].troops=Math.max(1,state[a].troops-Math.max(1,def));status.textContent='🛡️ El ataque a '+data[b][0]+' fue rechazado.'}sel=-1;render();checkWin()}function add(){if(sel<0||state[sel].owner!=='me'){status.textContent='Selecciona un territorio tuyo.';return}if(reinf<=0){status.textContent='No quedan refuerzos este turno.';return}state[sel].troops++;reinf--;render()}function aiTurn(){const aggression={easy:.25,normal:.48,hard:.68,expert:.82}[diff];let bonus={easy:2,normal:3,hard:3,expert:4}[diff];const mine=state.map((s,i)=>s.owner==='ai'?i:-1).filter(i=>i>=0);for(let k=0;k<bonus;k++){const i=mine[Math.floor(Math.random()*mine.length)];if(i!==undefined)state[i].troops++}let attacks=diff==='easy'?1:diff==='normal'?2:3;for(let z=0;z<attacks;z++){const options=[];state.forEach((s,i)=>{if(s.owner!=='ai'||s.troops<2)return;state.forEach((t,j)=>{if(t.owner!=='ai'&&adj(i,j)&&s.troops>t.troops*(diff==='expert'?.8:1))options.push([i,j])})});if(options.length&&Math.random()<aggression){options.sort((x,y)=>state[y[0]].troops-state[x[0]].troops);const[a,b]=options[0],atk=Math.min(3,state[a].troops-1),def=Math.min(2,state[b].troops);if(atk*(.65+Math.random()*.7)>def*(.65+Math.random()*.7)){state[a].troops-=atk;state[b].owner='ai';state[b].troops=Math.max(1,atk-Math.floor(def/2))}else state[a].troops=Math.max(1,state[a].troops-Math.max(1,def))}}turn++;reinf=Math.max(3,Math.floor(state.filter(x=>x.owner==='me').length/3));render();status.textContent='Tu turno. Recibes '+reinf+' refuerzos.';checkWin()}function checkWin(){const me=state.filter(x=>x.owner==='me').length,ai=state.filter(x=>x.owner==='ai').length;if(me>=10||state[aiCapital].owner==='me'){status.textContent='🏆 ¡Victoria! '+playerCountry+' domina Europa.';document.querySelectorAll('.actions button').forEach(b=>b.disabled=true)}else if(me===0){status.textContent='Derrota. Europa ha caído ante el rival.';document.querySelectorAll('.actions button').forEach(b=>b.disabled=true)}else if(ai===0){status.textContent='🏆 ¡Victoria total!';document.querySelectorAll('.actions button').forEach(b=>b.disabled=true)}}document.getElementById('start').addEventListener('click',start);document.getElementById('add').addEventListener('click',add);document.getElementById('attack').addEventListener('click',()=>{if(sel<0)status.textContent='Selecciona primero un territorio tuyo y luego toca el objetivo en el mapa.';else status.textContent='Ahora toca en el mapa un territorio vecino para atacarlo.'});document.getElementById('end').addEventListener('click',()=>{sel=-1;status.textContent='Turno rival…';render();setTimeout(aiTurn,450)});</script></body></html>
