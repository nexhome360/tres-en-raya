<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f97316">
<title>Marcan3nRaya</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#f97316;color:#8a3a00;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{min-height:100dvh;display:grid;place-items:center;padding:16px;touch-action:manipulation}.app{width:min(100%,520px);background:#fff;border:1px solid #fed7aa;border-radius:24px;padding:20px;box-shadow:0 24px 70px #9a341233}h1{margin:0 0 6px;font-size:clamp(2rem,10vw,3.5rem);letter-spacing:-.06em;color:#f97316}.sub{margin:0 0 18px;color:#9a5a2e}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}select,button{font:inherit;color:#9a3412;background:#fff7ed;border:1px solid #fdba74;border-radius:14px;min-height:48px;padding:0 12px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.score div{padding:10px;background:#fff7ed;border:1px solid #ffedd5;border-radius:14px;text-align:center}.score strong{display:block;font-size:1.4rem;color:#f97316}.score span{font-size:.75rem;color:#9a5a2e}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;min-height:34px;font-weight:700}.chip{font-size:.75rem;color:#c2410c;border:1px solid #fdba74;background:#fff7ed;border-radius:999px;padding:7px 10px;white-space:nowrap}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{appearance:none;padding:0;min-height:0;border-radius:18px;background:#fff7ed;border:2px solid #fdba74;color:#f97316;font-size:clamp(3rem,20vw,6rem);font-weight:900;line-height:1;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}.cell:active:not(:disabled){transform:scale(.96);background:#ffedd5}.cell:disabled{opacity:1}.cell.o{color:#9a3412}.cell.win{outline:3px solid #f97316;background:#ffedd5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.primary{background:#f97316;color:#fff;border:1px solid #f97316;font-weight:800}.primary:active{background:#ea580c}.note{text-align:center;color:#9a5a2e;font-size:.75rem;margin:14px 0 0}@media(max-width:420px){body{padding:10px}.app{padding:14px;border-radius:20px}.controls,.actions{grid-template-columns:1fr}.board{gap:8px}.cell{border-radius:15px}}
</style>
</head>
<body>
<main class="app">
<h1>Marcan3nRaya</h1>
<p class="sub">Toca una casilla para jugar.</p>
<div class="controls"><select id="mode"><option value="cpu">Contra la máquina</option><option value="pvp">Dos jugadores</option></select><select id="diff"><option value="easy">Máquina casual</option><option value="hard">Máquina imbatible</option></select></div>
<div class="score"><div><strong id="sx">0</strong><span id="lx">Tú (X)</span></div><div><strong id="sd">0</strong><span>Empates</span></div><div><strong id="so">0</strong><span id="lo">CPU (O)</span></div></div>
<div class="status"><span id="status">Tu turno.</span><span id="turn" class="chip">Turno: X</span></div>
<section class="board" id="board" aria-label="Tablero de 3 en raya"></section>
<div class="actions"><button class="primary" id="newRound">Nueva ronda</button><button id="reset">Reiniciar marcador</button></div>
<p class="note">Compatible con pantalla táctil, ratón y teclado.</p>
</main>
<script>
const boardEl=document.getElementById('board'),modeEl=document.getElementById('mode'),diffEl=document.getElementById('diff'),statusEl=document.getElementById('status'),turnEl=document.getElementById('turn'),sx=document.getElementById('sx'),so=document.getElementById('so'),sd=document.getElementById('sd'),lx=document.getElementById('lx'),lo=document.getElementById('lo');
let board,turn,over,scores={X:0,O:0,D:0};
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function result(b){for(const w of wins){if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return {winner:b[w[0]],line:w}}return b.every(Boolean)?{winner:'D',line:[]}:null}
function render(){[...boardEl.children].forEach((c,i)=>{c.textContent=board[i]||'';c.className='cell'+(board[i]?(' '+board[i].toLowerCase()):'');c.disabled=!!board[i]||over||(modeEl.value==='cpu'&&turn==='O')});turnEl.textContent='Turno: '+turn;sx.textContent=scores.X;so.textContent=scores.O;sd.textContent=scores.D;lx.textContent=modeEl.value==='cpu'?'Tú (X)':'Jugador X';lo.textContent=modeEl.value==='cpu'?'CPU (O)':'Jugador O';diffEl.disabled=modeEl.value==='pvp'}
function finish(r){over=true;scores[r.winner]++;if(r.winner==='D')statusEl.textContent='Empate.';else statusEl.textContent=(modeEl.value==='cpu'?(r.winner==='X'?'¡Has ganado!':'Gana la máquina.'):'Gana '+r.winner+'.');r.line.forEach(i=>boardEl.children[i].classList.add('win'));render()}
function play(i){if(over||board[i])return;board[i]=turn;const r=result(board);if(r){finish(r);return}turn=turn==='X'?'O':'X';statusEl.textContent=modeEl.value==='cpu'&&turn==='O'?'La máquina está pensando…':'Turno de '+turn+'.';render();if(modeEl.value==='cpu'&&turn==='O')setTimeout(cpuMove,220)}
function randomMove(){const a=board.map((v,i)=>v?null:i).filter(v=>v!==null);return a[Math.floor(Math.random()*a.length)]}
function minimax(b,isMax){const r=result(b);if(r)return r.winner==='O'?10:r.winner==='X'?-10:0;let best=isMax?-Infinity:Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=isMax?'O':'X';const s=minimax(b,!isMax);b[i]='';best=isMax?Math.max(best,s):Math.min(best,s)}return best}
function bestMove(){let best=-Infinity,move=0;for(let i=0;i<9;i++)if(!board[i]){board[i]='O';const s=minimax(board,false);board[i]='';if(s>best){best=s;move=i}}return move}
function cpuMove(){if(over)return;play(diffEl.value==='hard'?bestMove():randomMove())}
function newRound(){board=Array(9).fill('');turn='X';over=false;statusEl.textContent=modeEl.value==='cpu'?'Tu turno.':'Turno de X.';[...boardEl.children].forEach(c=>c.classList.remove('win'));render()}
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('aria-label','Casilla '+(i+1));b.addEventListener('pointerup',e=>{e.preventDefault();play(i)});boardEl.appendChild(b)}
modeEl.addEventListener('change',newRound);diffEl.addEventListener('change',newRound);document.getElementById('newRound').addEventListener('click',newRound);document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0,D:0};newRound()});document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')play(Number(e.key)-1)});newRound();
</script>
</body>
</html>
