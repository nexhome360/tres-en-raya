<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Simón Sonoro</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,540px);background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 70px #9a341233}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 4px;color:#f97316;font-size:clamp(2rem,10vw,3.4rem)}p{margin:0 0 14px;color:#9a5a2e}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.score{background:#fff7ed;border:1px solid #fdba74;border-radius:999px;padding:8px 12px;font-weight:800}.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pad{aspect-ratio:1;border:0;border-radius:24px;font-size:2.5rem;touch-action:manipulation}.p0{background:#fb7185}.p1{background:#60a5fa}.p2{background:#facc15}.p3{background:#4ade80}.pad.on{filter:brightness(1.3);transform:scale(.97);outline:5px solid #fff7ed}.start{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;background:#f97316;color:#fff;font:800 1rem system-ui}.status{text-align:center;font-weight:800;margin-top:12px;color:#c2410c}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>🔊 Simón Sonoro</h1><p>Escucha la secuencia y repítela tocando los colores.</p><div class="top"><span class="score">Nivel: <b id="level">0</b></span><span class="score">Récord: <b id="best">0</b></span></div><section class="pads" id="pads"></section><button id="start" class="start">Empezar</button><div id="status" class="status">Pulsa empezar</div></main><script>const freqs=[261.63,329.63,392,523.25],P=document.getElementById('pads'),L=document.getElementById('level'),B=document.getElementById('best'),S=document.getElementById('status');let ctx,seq=[],input=[],locked=true,best=Number(localStorage.simonBest||0);B.textContent=best;function audio(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(i){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freqs[i];g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.36)}function flash(i,d=350){const e=P.children[i];e.classList.add('on');tone(i);setTimeout(()=>e.classList.remove('on'),d)}for(let i=0;i<4;i++){const b=document.createElement('button');b.className='pad p'+i;b.textContent=['🍎','💧','⭐','🍀'][i];b.addEventListener('pointerdown',e=>{e.preventDefault();if(locked)return;flash(i,180);input.push(i);const n=input.length-1;if(input[n]!==seq[n]){locked=true;S.textContent='¡Ups! Pulsa empezar';if(seq.length-1>best){best=seq.length-1;localStorage.simonBest=best;B.textContent=best}return}if(input.length===seq.length){locked=true;S.textContent='¡Muy bien!';setTimeout(next,650)}});P.appendChild(b)}function show(){locked=true;input=[];S.textContent='Escucha…';seq.forEach((v,i)=>setTimeout(()=>flash(v),i*600));setTimeout(()=>{locked=false;S.textContent='Tu turno'},seq.length*600+200)}function next(){seq.push(Math.floor(Math.random()*4));L.textContent=seq.length;show()}document.getElementById('start').onclick=()=>{audio();seq=[];L.textContent=0;next()};</script></body></html>
