<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f97316"><title>Atrapa el Punto</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#f97316;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:14px;color:#8a3a00}.app{width:min(100%,520px);background:#fff;border-radius:24px;padding:18px}a{color:#c2410c;font-weight:800;text-decoration:none}h1{margin:10px 0 6px;color:#f97316}.sub{margin:0 0 14px}.stats{display:flex;justify-content:space-between;background:#fff7ed;padding:10px 12px;border-radius:14px;margin-bottom:12px}.arena{position:relative;width:100%;aspect-ratio:1;background:#fff7ed;border:2px solid #fdba74;border-radius:20px;overflow:hidden}.dot{position:absolute;width:64px;height:64px;border-radius:50%;background:#f97316;border:0;box-shadow:0 8px 20px #f9731655;touch-action:manipulation}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{font:inherit;min-height:48px;border-radius:14px;border:1px solid #fdba74;background:#fff7ed;color:#9a3412}.primary{background:#f97316;color:#fff;border-color:#f97316;font-weight:800}</style></head><body><main class="app"><a href="./">← Juegos</a><h1>Atrapa el Punto</h1><p class="sub">Tócalo tantas veces como puedas en 20 segundos.</p><div class="stats"><span>Puntos: <b id="score">0</b></span><span>Tiempo: <b id="time">20</b>s</span></div><section class="arena" id="arena"><button class="dot" id="dot" aria-label="Punto"></button></section><div class="actions"><button class="primary" id="start">Empezar</button><button id="reset">Reiniciar</button></div></main><script>const A=document.getElementById('arena'),D=document.getElementById('dot'),S=document.getElementById('score'),T=document.getElementById('time');let score=0,time=20,timer=null,playing=false;function move(){const r=A.getBoundingClientRect(),d=64;D.style.left=Math.max(0,Math.random()*(r.width-d))+'px';D.style.top=Math.max(0,Math.random()*(r.height-d))+'px'}function reset(){clearInterval(timer);score=0;time=20;playing=false;S.textContent=0;T.textContent=20;D.style.display='block';move()}function start(){if(playing)return;playing=true;score=0;time=20;S.textContent=0;T.textContent=20;move();timer=setInterval(()=>{time--;T.textContent=time;if(time<=0){clearInterval(timer);playing=false;D.style.display='none';setTimeout(()=>alert('Tiempo. Puntuación: '+score),100)}},1000)}D.addEventListener('pointerup',e=>{e.preventDefault();if(!playing)return;score++;S.textContent=score;move()});document.getElementById('start').onclick=start;document.getElementById('reset').onclick=reset;addEventListener('resize',move);reset();</script></body></html>
